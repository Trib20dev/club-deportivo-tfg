server:
  port: 8080

spring:
  application:
    name: club-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/club_deportivo
    username: club_app_user
    password: app_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    user: club_admin
    password: admin_pass
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000